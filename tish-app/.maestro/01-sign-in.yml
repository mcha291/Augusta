# Smoke test: a real account can sign in and reach the app.
#
# This is the flow worth having even if there is never a second one. It is the
# only check in the repo that exercises Cognito, AuthContext and the RDS profile
# lookup together against a real build — the unit suites all stop at the
# module boundary, and a broken Amplify config or a Lambda that 500s on
# /users/me fails here and nowhere else.
appId: ${MAESTRO_APP_ID}
name: Sign in
tags:
  - smoke
---
- runFlow: subflows/sign-in.yml

# The subflow already waits for the tab bar. Assert the rest of it too, so a
# navigator that mounts one button but fails to render the bar still fails.
- assertVisible:
    id: 'tab-medications'

# Landing on Home specifically, not merely on something with a tab bar.
#
# This was optional for a while, as a probe: `screen-home` sits on a plain
# container `View`, and the theory was that XCUITest cannot see testIDs on
# containers because they are not accessibility elements in their own right.
# The theory was wrong — it resolves fine, here and on all four screens in
# 02-tab-navigation. What made it look otherwise was iOS's "Save Password?"
# dialog covering the screen during the one run where it warned.
- assertVisible:
    id: 'screen-home'
