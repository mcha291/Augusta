# Smoke test: a real account can sign in and reach the app.
#
# This is the flow worth having even if there is never a second one. It is the
# only check in the repo that exercises Cognito, AuthContext and the RDS profile
# lookup together against a real build — the unit suites all stop at the
# module boundary, and a broken Amplify config or a Lambda that 500s on
# /users/me fails here and nowhere else.
appId: ${MAESTRO_APP_ID}
name: Sign in
tags:
  - smoke
---
- runFlow: subflows/sign-in.yml

# The subflow already waits for the tab bar. Assert the rest of it too, so a
# navigator that mounts one button but fails to render the bar still fails.
- assertVisible:
    id: 'tab-medications'

# Deliberately optional, and here to answer one question rather than to guard
# anything: can Maestro see a testID on a plain container `View` on iOS at all?
# `screen-home` sits on the Home screen's root view. If this warns while every
# assertion above passes, container testIDs are invisible to XCUITest and the
# per-screen assertions in 02-tab-navigation need to move onto elements that
# are accessibility elements in their own right. If it passes, they are fine as
# they are. Either way the suite's verdict does not hinge on it.
- assertVisible:
    id: 'screen-home'
    optional: true
