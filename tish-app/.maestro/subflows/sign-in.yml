# Reusable sign-in. Every flow that needs an authenticated session starts here.
#
# Lives under subflows/ so `flows: ['*.yml']` in config.yaml does not pick it up
# as a test — it has no assertions of its own beyond reaching Home, and running
# it twice per suite would only slow things down.
appId: ${MAESTRO_APP_ID}
---
- launchApp:
    # Start from a signed-out app every time. Without this the second flow in a
    # run inherits the first one's session and silently stops testing login.
    clearState: true
    permissions:
      notifications: allow

- extendedWaitUntil:
    visible:
      id: 'login-identifier'
    timeout: 30000

- tapOn:
    id: 'login-identifier'
- inputText: ${MAESTRO_USERNAME}

- tapOn:
    id: 'login-password'
- inputText: ${MAESTRO_PASSWORD}

# Dismiss the keyboard before going near the submit button. This is the whole
# ballgame, not a tidy-up: with the keyboard up, `login-submit` occupies
# y=531..587 while the keyboard occupies y=539 downward, so the button's centre
# is *underneath* it. Maestro still reports `tapOn` as COMPLETED — the element
# it targeted is present and on-screen, merely covered — and the tap lands on
# the keyboard. Every symptom followed from that: handleLogin never ran, so
# there was no network call, no error alert, and no navigation.
#
# `pressKey: Enter` rather than `hideKeyboard`, which Maestro documents as
# unreliable on iOS (there is no native dismissal API). The password field is
# the last input and has no `onSubmitEditing`, so Return just blurs it, which
# is both deterministic and what a real user does.
- pressKey: Enter

# Kept as a safety net for shorter viewports, where the button can sit below
# the fold even with the keyboard gone. A no-op when it is already visible.
- scrollUntilVisible:
    element:
      id: 'login-submit'
    direction: DOWN

- tapOn:
    id: 'login-submit'

# Dismiss iOS's "Save Password?" prompt.
#
# It is a *system* dialog, not the app's: iOS offers to store credentials after
# it sees a successful login submission. It slides in a second or two later and
# covers whatever the app is showing, which is exactly what failed the tab-bar
# assertion in the previous run — the app had signed in correctly and rendered
# Home behind it.
#
# Both steps are optional because it does not appear every time; the first
# sign-in on a fresh simulator went straight through without it. The wait comes
# before the tap so a dialog that is still animating in is not missed, which is
# the race that made the previous run fail on the second flow but not the
# first.
#
# Matching on system text is a deliberate exception to the "testIDs, never
# text" rule elsewhere in these flows: this dialog belongs to iOS, not the app,
# so it is not covered by the app's i18n, and the CI simulator's locale is
# fixed. Dismissed rather than suppressed at the simulator level — recent iOS
# is reported to keep showing it even with password AutoFill disabled.
- extendedWaitUntil:
    visible:
      text: 'Not Now'
    timeout: 15000
    optional: true

- tapOn:
    text: 'Not Now'
    optional: true

# Sign-in is two round trips, not one: Cognito authenticates, then AuthContext
# calls checkUser() against RDS before it will navigate. 30s covers a cold
# Lambda on top of both.
#
# The landing signal is the tab bar rather than the Home screen's root view,
# because a tab button is a touchable and therefore unambiguously an element in
# its own right.
#
# An earlier version of this comment claimed the Home root was *invisible* to
# XCUITest because plain container views get collapsed out of the accessibility
# hierarchy. That was a guess, and it was wrong: `tab-index` failed identically,
# and the captured hierarchy showed the run never left the login screen at all.
# Whether a testID on a container view resolves on iOS is still an open
# question — the optional `screen-home` assertion in 01-sign-in.yml is what
# answers it.
- extendedWaitUntil:
    visible:
      id: 'tab-index'
    timeout: 30000
