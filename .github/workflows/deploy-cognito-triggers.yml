name: Deploy Cognito triggers

# The Pre Sign-up trigger for the tish-admin user pool. Small and dependency
# free, but it is the only thing restricting who can register an account, so it
# gets the same test-before-deploy gate as the other Lambdas.
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/cognito-triggers/**'
      - '.github/workflows/deploy-cognito-triggers.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/cognito-triggers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        # No dependencies at all, so there is nothing to install first.
        run: npm test

      - name: Package function
        run: zip -r function.zip index.mjs package.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.PRESIGNUP_FUNCTION_NAME }}" \
            --zip-file fileb://function.zip \
            --publish
