name: iOS build + TestFlight

# Deliberate trigger only — native iOS builds are slow and consume EAS build
# minutes, so this is NOT on every push. Run it from the Actions tab
# (workflow_dispatch) or by pushing a version tag like v1.2.0.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tish-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tish-app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Fail fast. EAS only validates the submit config *after* the cloud build
      # finishes, so a placeholder or an unpushed eas.json costs a full build
      # (~20 min of EAS minutes) before erroring out. Catch it in seconds.
      # Remember CI reads eas.json from the pushed commit, not your working copy.
      - name: Validate TestFlight submit config
        run: |
          node -e '
            const ios = JSON.parse(require("fs").readFileSync("eas.json", "utf8")).submit?.production?.ios ?? {};
            const problems = [];
            if (!/^[0-9]+$/.test(ios.ascAppId ?? ""))
              problems.push(`ascAppId must be digits only, got ${JSON.stringify(ios.ascAppId)}`);
            if (!/^[A-Z0-9]{10}$/.test(ios.appleTeamId ?? ""))
              problems.push(`appleTeamId must be 10 uppercase letters/digits, got ${JSON.stringify(ios.appleTeamId)}`);
            if (problems.length) {
              console.error("eas.json submit.production.ios is not ready:");
              for (const p of problems) console.error("  - " + p);
              console.error("");
              console.error("Fix tish-app/eas.json and PUSH the commit — see tish-app/TESTFLIGHT.md step 3.");
              process.exit(1);
            }
            console.log(`OK - ascAppId ${ios.ascAppId}, appleTeamId ${ios.appleTeamId}`);
          '

      # Builds on EAS's cloud (this runner only triggers it), then submits the
      # resulting .ipa to App Store Connect / TestFlight using the eas.json
      # submit config + the ASC API key stored in EAS credentials. No Apple
      # secrets live in this repo or in GitHub.
      - name: EAS build + auto-submit to TestFlight
        run: eas build --platform ios --profile production --non-interactive --auto-submit
