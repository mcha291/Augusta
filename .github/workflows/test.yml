name: Tests

# Runs on every push to any branch and on PRs. Two jobs: the admin Lambda's
# functional tests, and typecheck+build of the dashboard SPA itself.
on:
  push:
  pull_request:

jobs:
  admin-lambda:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci --omit=dev

      - run: npm test

  app-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build
