name: Deploy admin API Lambda

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/server/**'

# OIDC role assumption — no long-lived AWS keys in GitHub. One role
# (`github-lambda-deploy`) covers this Lambda and the app backend's; setup is
# documented in tish-app/backend/DEPLOY.md.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/server/package-lock.json

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Run functional tests
        # Deploy gate — a failing handler never ships. Tests use node's
        # built-in runner and stubbed I/O, so no extra deps or services needed.
        run: npm test

      - name: Package function
        run: zip -r function.zip index.mjs package.json node_modules

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update Lambda code
        # One zip, two functions. They run identical code and differ only in
        # VPC attachment and env: the first is in the VPC to reach the private
        # RDS and serves /tables; the second is outside it to reach
        # api.github.com and serves /translations. A VPC-attached Lambda in
        # these subnets has no internet route at all, which is why this is two
        # functions instead of one. See dashboard/AWS-SETUP.md.
        #
        # Both must be updated together — they share a source file, so shipping
        # one and not the other leaves the routes running different builds.
        run: |
          for fn in "${{ vars.ADMIN_FUNCTION_NAME }}" "${{ vars.TRANSLATIONS_FUNCTION_NAME }}"; do
            echo "Deploying $fn..."
            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file fileb://function.zip \
              --publish \
              --query 'Version' --output text
          done
