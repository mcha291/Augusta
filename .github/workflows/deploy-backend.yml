name: Deploy backend Lambda

on:
  push:
    branches: [main]
    paths:
      - 'tish-app/backend/**'

# OIDC: the workflow exchanges a GitHub-signed token for short-lived AWS
# credentials by assuming an IAM role — no long-lived AWS keys are stored in
# GitHub. One-time setup: tish-app/backend/DEPLOY.md
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tish-app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tish-app/backend/package-lock.json

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Run functional tests
        # Deploy gate — a failing handler never ships. Tests use node's
        # built-in runner and stubbed I/O, so no extra deps or services needed.
        run: npm test

      - name: Package function
        # `migrate.mjs` and `migrations/` are in the artifact because
        # `tish-migrate` runs from this same zip and differs only by handler.
        # They were previously omitted, which meant a new migration file could
        # be committed, pushed and merged while `tish-migrate status` still
        # reported nothing pending — the migration did not exist as far as the
        # runner was concerned until somebody hand-built a zip containing it.
        run: zip -r function.zip index.mjs migrate.mjs migrations package.json node_modules

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # **Deploying the runner does not run anything.** `tish-migrate` has no
      # trigger and no API Gateway integration; this only puts the migration
      # files where it can see them. Applying them stays a deliberate manual
      # act — `{"command":"status"}`, then `up --dry-run`, then `up`.
      #
      # **Which means the ordering hazard is yours to manage, not CI's.** If a
      # push carries both a migration and handler code that reads the column it
      # adds, this workflow ships the handler while the column does not exist
      # yet, and every request touching it fails until the migration is run.
      # Apply the migration *before* merging schema-dependent code.
      - name: Update Lambda code
        run: |
          for fn in "${{ vars.BACKEND_FUNCTION_NAME }}" tish-migrate; do
            echo "Deploying $fn..."
            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file fileb://function.zip \
              --publish
          done
